services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:inception
    container_name: mariadb
    restart: always
    networks:
      - inception_network
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception_network
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/html

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    networks:
      - inception_network
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wordpress
  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: inception_redis:latest
    container_name: redis
    restart: always
    networks:
      - inception_network
    depends_on:
      - wordpress 

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: inception_adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080" 
    networks:
      - inception_network
    depends_on:
      - mariadb

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    image: inception_ftp:latest
    container_name: ftp
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "40000-40005:40000-40005" 
    networks:
      - inception_network
    volumes:
      - wp_data:/var/www/html 
  static_website:
    build:
      context: ./requirements/bonus/website
      dockerfile: Dockerfile
    image: inception_website:latest
    container_name: static_website
    restart: always
    ports:
      - "8081:80"
    networks:
      - inception_network
    volumes:
      - ./requirements/bonus/website/html:/usr/share/nginx/html:ro
  portainer:
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    image: inception_portainer:latest
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - inception_network
networks:
  inception_network:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hdargui/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hdargui/data/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hdargui/data/portainer
